# The plugin allowlist for seat runs: the skills each seat's pass loads, and nothing else.
#
# Written on the Motioncraft build map's "Plugin allowlist and launch form for seat
# runs" ticket (2026-10-19), from the seat files' toolbelts and the plugin-routing
# brief. `seat.py toolbelt` copies each listed skill into this machine's toolbelt
# folder (~/.local/share/motioncraft/toolbelt/<seat>/), outside every repo: on Claude
# that folder is the seat's own plugin (`--plugin-dir`); on Codex the launcher names
# each skill's path in the prompt. A copy, not a link, so a pass reads a fixed,
# hashed copy and an edit upstream shows in `seat.py check` until the copy is rebuilt.
# A seat or gate not listed here loads no skill. Change a line here only with the
# seat file's toolbelt line, and only with Sean's yes for a new tool (bindings rule:
# a tool Devcraft ships back joins a toolbelt only through this file).

# Where each source's skills are found on a machine. A glob takes its newest match.
[sources]
agents = "~/.agents/skills"
claude-desktop = "~/Library/Application Support/Claude/local-agent-mode-sessions/skills-plugin/*/*/skills"
watch = "~/.claude/plugins/cache/claude-video/watch/*/skills"

# `image = true`: the pass may call the Codex image path through `launcher/image.py`.
# Only the Director and Art; only on Claude, and never on a read-only pass.
# `sound = true`: the pass may call ElevenLabs (sound effects) and Lyria (music)
# through `launcher/sound.py`, for the cues on Sean's approved cue list. Finishing
# alone; only on Claude, and never on a read-only pass.
# `higgsfield = "image"` or `"video"`: the pass may ask the launcher for one take of an
# entry on Sean's approved Higgsfield list, through `launcher/higgsfield.py` (SWCB #271,
# Sean's pick at mc-eng-002's Open, 2026-10-24). Art alone makes images there and the
# Animator alone video; on either vendor, and never on a read-only pass.
[seats.visual-story-director]
skills = ["agents:motion-art-direction", "agents:shot-composition", "agents:beat-sync-editing",
          "agents:animation-vocabulary", "watch:watch"]
image = true
apps = ["blender"]

[seats.art-pose-designer]
skills = ["claude-desktop:2d-animation-principles", "agents:shot-composition"]
image = true
apps = ["krita"]
higgsfield = "image"

[seats.animator]
skills = ["claude-desktop:2d-animation-principles", "agents:animation-principles"]
apps = ["blender"]
tools = ["kerning"]
higgsfield = "video"

[seats.finishing-sound-designer]
skills = ["agents:color-motion", "agents:beat-sync-editing"]
apps = ["resolve"]
sound = true

# `apps`: the applications a seat's drafting pass may run through the application
# doorway (`launcher/apps.py`), on either vendor: the Director's animatic, in Blender's
# sequencer; Art's painted layers, in Krita with no screen and so without Krita's brush
# engine (the map's "Krita's doorway" ticket, 2026-10-20: Art draws strokes with Qt's
# painter); the Animator's Blender scene; Finishing's delivery project. Each pass
# writes only its own stage, so two seats on Blender each work in their own files
# (rule 5; the map's "Tool ownership" ticket, 2026-10-20, which also dropped the
# Animator's `resolve` line: its renders cross to Finishing as files).
# The paths below are what the doorway's locks run, and `higgsfield` the command line the Higgsfield
# doorway runs, outside any lock; a missing one is a gap in `seat.py check`.
#
# `tools`: pipeline software Devcraft built for the seat, one module each in `motioncraft/tools/`,
# named here with Sean's yes (the bindings rule above). A drafting pass's context fixes each by
# hash and its prompt names each by path; the pass runs it in a script it asks the doorway to
# run, or from its shell. The Animator's `kerning` writes a font's own pair kerning into a Blender
# text object (SWCB #255, Sean's yes 2026-10-21). A listed tool missing is a gap in `seat.py check`.
[apps]
blender = "/Applications/Blender.app/Contents/MacOS/Blender"
krita = "/Applications/Krita.app/Contents/MacOS/kritarunner"
python = "/opt/homebrew/bin/python3"
higgsfield = "~/.local/bin/higgsfield"

# What every pass's environment carries for the two tested applications, since the
# launcher scrubs the rest: Blender's folder joins PATH (`blender` is a shell alias
# on these Macs, which a pass's shell never reads), and Resolve's scripting variables
# as Blackmagic's scripting README sets them. A missing path is a gap in `seat.py check`.
[env]
path = ["/Applications/Blender.app/Contents/MacOS"]
RESOLVE_SCRIPT_API = "/Library/Application Support/Blackmagic Design/DaVinci Resolve/Developer/Scripting"
RESOLVE_SCRIPT_LIB = "/Applications/DaVinci Resolve/DaVinci Resolve.app/Contents/Libraries/Fusion/fusionscript.so"
PYTHONPATH = "/Library/Application Support/Blackmagic Design/DaVinci Resolve/Developer/Scripting/Modules"

# Names no seat's probe may show anywhere it lists a loaded skill, plugin, tool or
# connector: the seat files' Never lines, as the plugin-routing brief named them.
# Higgsfield stays here: Art and the Animator reach it only by asking the launcher,
# never through a skill, a plugin or the connector a pass would load.
[never]
names = ["higgsfield", "adobe", "hyperframes", "remotion", "creative-director", "animation-pipeline",
         "gemini", "nanobanana", "notebooklm", "image-generator-prompt-science", "kinetic-typography",
         "publish", "deploy", "tiktok"]
